name: Quality diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-contracts:
    name: Diagnostic A - policies, docs, and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Verify dependency, workflow, and documentation policies
        run: |
          npm run check:dependencies
          npm run check:workflow-actions
          npm run check:docs

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run the scoped TypeScript check
        run: npm run typecheck

  generated-assets:
    name: Diagnostic B - generated PDF.js assets
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Verify generated PDF.js assets are committed
        run: git diff --exit-code -- web/vendor/pdfjs

  node-tests:
    name: Diagnostic C - Node tests (${{ matrix.range }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - range: a-c
            pattern: tests/[a-c]*.test.ts
          - range: d-h
            pattern: tests/[d-h]*.test.ts
          - range: i-o
            pattern: tests/[i-o]*.test.ts
          - range: p-r
            pattern: tests/[p-r]*.test.ts
          - range: s-z
            pattern: tests/[s-z]*.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run Node test range
        run: ./node_modules/.bin/tsx --test ${{ matrix.pattern }}

  browser-tests:
    name: Diagnostic D - browser tests (${{ matrix.range }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - range: a-b
            pattern: tests/browser/[a-b]*.spec.ts
          - range: c-e
            pattern: tests/browser/[c-e]*.spec.ts
          - range: f-l
            pattern: tests/browser/[f-l]*.spec.ts
          - range: m-p
            pattern: tests/browser/[m-p]*.spec.ts
          - range: q-z
            pattern: tests/browser/[q-z]*.spec.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install pinned Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser test range
        run: ./node_modules/.bin/playwright test ${{ matrix.pattern }}
