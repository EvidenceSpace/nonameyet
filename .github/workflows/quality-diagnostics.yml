name: Quality diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-test-files:
    name: Diagnostic Node File - ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: browser-image-ocr
            file: tests/browser-image-ocr.test.ts
          - label: browser-mixed-pdf
            file: tests/browser-mixed-pdf-transparency.test.ts
          - label: browser-readiness
            file: tests/browser-readiness.test.ts
          - label: browser-suggestion
            file: tests/browser-suggestion-handoff.test.ts
          - label: image-active-cleanup
            file: tests/image-ocr-active-cleanup.test.ts
          - label: image-output-limits
            file: tests/image-ocr-output-limits.test.ts
          - label: pdf-document-ocr
            file: tests/pdf-document-ocr.test.ts
          - label: pdf-failure-wiring
            file: tests/pdf-failure-recovery-wiring.test.ts
          - label: pdf-mixed-ocr
            file: tests/pdf-mixed-ocr-integration.test.ts
          - label: pdf-cancellation-wiring
            file: tests/pdf-processing-cancellation-wiring.test.ts
          - label: pdf-limits
            file: tests/pdf-processing-limits.test.ts
          - label: pdf-scanned-retry
            file: tests/pdf-scanned-retry-integration.test.ts
          - label: pdf-signature-wiring
            file: tests/pdf-signature-preflight-wiring.test.ts
          - label: pdfjs-adapter
            file: tests/pdfjs-adapter.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run one bounded Node test file
        run: timeout 90s ./node_modules/.bin/tsx --test "${{ matrix.file }}"

  browser-test-files:
    name: Diagnostic Browser File - ${{ matrix.file }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        file:
          - currency-neutral-amount.spec.ts
          - image-ocr-active-cleanup.spec.ts
          - image-ocr-timeout.spec.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install pinned Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run one browser specification
        run: ./node_modules/.bin/playwright test "tests/browser/${{ matrix.file }}"
