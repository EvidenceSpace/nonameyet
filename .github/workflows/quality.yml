name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Static quality and deterministic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Verify direct dependency policy
        run: node scripts/check-dependency-policy.mjs

      - name: Verify workflow supply-chain policy
        run: node scripts/check-workflow-action-pins.mjs

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Run canonical checks and deterministic tests
        run: npm run check

      - name: Verify generated PDF.js assets are committed
        run: git diff --exit-code -- web/vendor/pdfjs

  browser-lifecycle:
    name: Chromium browser lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Verify direct dependency policy
        run: node scripts/check-dependency-policy.mjs

      - name: Verify workflow supply-chain policy
        run: node scripts/check-workflow-action-pins.mjs

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Verify generated PDF.js assets are committed
        run: git diff --exit-code -- web/vendor/pdfjs

      - name: Install pinned Chromium for lifecycle testing
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run every private-case browser lifecycle test
        run: npm run test:browser

  quality:
    name: Typecheck, tests, assets, and browser lifecycle
    if: ${{ always() }}
    needs: [code-quality, browser-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality gate
        env:
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          BROWSER_LIFECYCLE_RESULT: ${{ needs.browser-lifecycle.result }}
        run: |
          test "$CODE_QUALITY_RESULT" = success
          test "$BROWSER_LIFECYCLE_RESULT" = success
