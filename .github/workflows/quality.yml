name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-quality:
    name: Dependency, docs, assets, and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1

      - name: Verify direct dependency policy
        run: npm run check:dependencies

      - name: Verify workflow supply-chain policy
        run: npm run check:workflow-actions

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Verify canonical documentation
        run: npm run check:docs

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify generated PDF.js assets are committed
        run: git diff --exit-code -- web/vendor/pdfjs

  deterministic-tests:
    name: Deterministic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run deterministic tests
        run: npm test

  browser-lifecycle:
    name: Chromium browser lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1

      - name: Verify direct dependency policy
        run: npm run check:dependencies

      - name: Verify workflow supply-chain policy
        run: npm run check:workflow-actions

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Verify generated PDF.js assets are committed
        run: git diff --exit-code -- web/vendor/pdfjs

      - name: Install pinned Chromium for lifecycle testing
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run every private-case browser lifecycle test
        run: npm run test:browser

  quality:
    name: Typecheck, tests, assets, and browser lifecycle
    if: ${{ always() }}
    needs: [static-quality, deterministic-tests, browser-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality gate
        env:
          STATIC_QUALITY_RESULT: ${{ needs.static-quality.result }}
          DETERMINISTIC_TESTS_RESULT: ${{ needs.deterministic-tests.result }}
          BROWSER_LIFECYCLE_RESULT: ${{ needs.browser-lifecycle.result }}
        run: |
          test "$STATIC_QUALITY_RESULT" = success
          test "$DETERMINISTIC_TESTS_RESULT" = success
          test "$BROWSER_LIFECYCLE_RESULT" = success
