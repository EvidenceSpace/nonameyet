name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install pinned dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Verify direct dependency policy
        run: node scripts/check-dependency-policy.mjs

      - name: Verify workflow supply-chain policy
        run: node scripts/check-workflow-action-pins.mjs

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

  static:
    name: Typecheck and generated assets
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify generated PDF.js assets are committed
        run: git diff --exit-code -- web/vendor/pdfjs

  tests:
    name: Deterministic (${{ matrix.name }})
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include:
          - name: account-analysis
            patterns: tests/account-*.test.ts tests/analysis-*.test.ts
          - name: browser-wiring
            patterns: tests/browser-*.test.ts
          - name: case
            patterns: tests/case-*.test.ts
          - name: checklist-consistency
            patterns: tests/checklist-*.test.ts tests/consistency-*.test.ts
          - name: extraction
            patterns: tests/extraction-*.test.ts tests/extraction.test.ts
          - name: transitions
            patterns: tests/fact-*.test.ts tests/file-*.test.ts
          - name: image
            patterns: tests/image-*.test.ts
          - name: intake-mixed
            patterns: tests/intake-*.test.ts tests/mixed-*.test.ts
          - name: identity
            patterns: tests/oidc-*.test.ts tests/original-*.test.ts
          - name: pdf-basic
            patterns: tests/pdf-document-*.test.ts tests/pdf-failure-*.test.ts tests/pdf-inspection.test.ts
          - name: pdf-mixed-ocr
            patterns: tests/pdf-mixed-*.test.ts tests/pdf-ocr-*.test.ts
          - name: pdf-page
            patterns: tests/pdf-page-*.test.ts
          - name: pdf-processing
            patterns: tests/pdf-processing-*.test.ts
          - name: pdf-retry-signature
            patterns: tests/pdf-scanned-*.test.ts tests/pdf-signature-*.test.ts
          - name: pdfjs
            patterns: tests/pdfjs-*.test.ts
          - name: processing
            patterns: tests/processing-*.test.ts tests/processing.test.ts
          - name: reports
            patterns: tests/product-*.test.ts tests/provider-*.test.ts tests/raster-*.test.ts tests/readiness.test.ts tests/report-*.test.ts tests/review-*.test.ts
          - name: source-storage
            patterns: tests/scanned-*.test.ts tests/session-*.test.ts tests/source-*.test.ts tests/sqlite-*.test.ts tests/storage-*.test.ts tests/timeline-*.test.ts tests/workspace-*.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run deterministic test group
        run: ./node_modules/.bin/tsx --test ${{ matrix.patterns }}

  browser:
    name: Chromium browser lifecycle
    needs: [static, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Install pinned Chromium for lifecycle testing
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run private-case browser lifecycle
        run: npm run test:browser

  quality:
    name: Typecheck, tests, assets, and browser lifecycle
    if: ${{ always() }}
    needs: [install, static, tests, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality gate
        env:
          INSTALL_RESULT: ${{ needs.install.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$INSTALL_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BROWSER_RESULT" = success
