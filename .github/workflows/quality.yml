name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install pinned dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Verify direct dependency policy
        run: node scripts/check-dependency-policy.mjs

      - name: Verify workflow supply-chain policy
        run: node scripts/check-workflow-action-pins.mjs

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

  static:
    name: Typecheck and generated assets
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify generated PDF.js assets are committed
        run: git diff --exit-code -- web/vendor/pdfjs

  tests:
    name: Deterministic full suite
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run every deterministic test
        run: npm test

  reports:
    name: Deterministic reports diagnostic
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Recheck the previously unexplained report group
        run: ./node_modules/.bin/tsx --test tests/product-*.test.ts tests/provider-*.test.ts tests/raster-*.test.ts tests/readiness.test.ts tests/report-*.test.ts tests/review-*.test.ts

  browser_targets:
    name: Chromium diagnostic (${{ matrix.name }})
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: intake-storage-recovery
            file: tests/browser/intake-storage-recovery.spec.ts
            grep: ""
          - name: intake-storage-unavailable
            file: tests/browser/intake-storage-unavailable.spec.ts
            grep: ""
          - name: image-ocr-output-limits
            file: tests/browser/image-ocr-output-limits.spec.ts
            grep: ""
          - name: intake-unavailable-steps
            file: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^unavailable navigation and steps settle$
          - name: intake-unavailable-callback
            file: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^unavailable callback and recovery state settle$
          - name: intake-unavailable-assertions
            file: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^unavailable recovery assertions and explicit close settle$
          - name: intake-blocked-callback
            file: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^blocked setup and recovery state settle$
          - name: intake-blocked-retry
            file: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^blocked retry and verification settle$
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Install pinned Chromium for lifecycle testing
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run focused recovery diagnostic
        env:
          TEST_FILE: ${{ matrix.file }}
          TEST_GREP: ${{ matrix.grep }}
        run: |
          if [ -n "$TEST_GREP" ]; then
            ./node_modules/.bin/playwright test "$TEST_FILE" --grep "$TEST_GREP"
          else
            ./node_modules/.bin/playwright test "$TEST_FILE"
          fi

  browser:
    name: Chromium full suite
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct runtime and development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Install pinned Chromium for lifecycle testing
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run every private-case browser lifecycle test
        run: npm run test:browser

  quality:
    name: Typecheck, tests, assets, and browser lifecycle
    if: ${{ always() }}
    needs: [install, static, tests, reports, browser_targets, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality gate
        env:
          INSTALL_RESULT: ${{ needs.install.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          REPORT_RESULT: ${{ needs.reports.result }}
          TARGET_RESULT: ${{ needs.browser_targets.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$INSTALL_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$REPORT_RESULT" = success
          test "$TARGET_RESULT" = success
          test "$BROWSER_RESULT" = success
