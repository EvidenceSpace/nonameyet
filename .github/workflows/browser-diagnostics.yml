name: Browser diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-diagnostic:
    name: Browser diagnostic — ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: foundation-backup
            files: >-
              tests/browser/accessibility.spec.ts
              tests/browser/analysis-input-validation.spec.ts
              tests/browser/backup-deep-link.spec.ts
              tests/browser/backup-interrupted-processing-recovery.spec.ts
          - name: cases
            files: >-
              tests/browser/case-archive-failure.spec.ts
              tests/browser/case-deletion-failure.spec.ts
              tests/browser/case-details-storage-failure.spec.ts
              tests/browser/case-history-empty-state.spec.ts
              tests/browser/case-hub-archive-restore.spec.ts
              tests/browser/case-hub-deletion.spec.ts
              tests/browser/case-hub-next-action.spec.ts
              tests/browser/case-lifecycle.spec.ts
              tests/browser/case-restore-failure.spec.ts
              tests/browser/checklist-storage-failure.spec.ts
              tests/browser/currency-neutral-amount.spec.ts
          - name: records-foundation
            files: >-
              tests/browser/duplicate-original-rejection.spec.ts
              tests/browser/encrypted-backup-restore.spec.ts
              tests/browser/extraction-warning-review.spec.ts
              tests/browser/fact-removal-failure.spec.ts
              tests/browser/file-deletion-failure.spec.ts
              tests/browser/file-storage-failure.spec.ts
              tests/browser/hostile-text-boundary.spec.ts
          - name: images-intake
            files: >-
              tests/browser/image-format-intake.spec.ts
              tests/browser/image-mime-integrity-boundary.spec.ts
              tests/browser/image-ocr-active-cleanup.spec.ts
              tests/browser/image-ocr-cancellation.spec.ts
              tests/browser/image-ocr-no-readable-text.spec.ts
              tests/browser/image-ocr-output-limits.spec.ts
              tests/browser/image-ocr-quality.spec.ts
              tests/browser/image-ocr-success.spec.ts
              tests/browser/image-ocr-timeout.spec.ts
              tests/browser/image-ocr-unavailable.spec.ts
              tests/browser/intake-storage-recovery.spec.ts
              tests/browser/intake-storage-unavailable.spec.ts
              tests/browser/intake-unsaved-exit.spec.ts
          - name: library-record-review
            files: >-
              tests/browser/library-workspace-accessibility.spec.ts
              tests/browser/linked-source-removal.spec.ts
              tests/browser/malformed-extraction-ui.spec.ts
              tests/browser/malformed-pdf-processing-boundary.spec.ts
              tests/browser/manual-fact-storage-failure.spec.ts
              tests/browser/ocr-quality-integrity.spec.ts
              tests/browser/original-hash-preflight.spec.ts
              tests/browser/original-source-preview.spec.ts
              tests/browser/oversized-file-rejection.spec.ts
          - name: pdf-processing
            files: >-
              tests/browser/pdf-processing-lifecycle.spec.ts
              tests/browser/pdf-signature-preflight.spec.ts
              tests/browser/processing-lease-recovery.spec.ts
              tests/browser/processing-storage-cas.spec.ts
          - name: reports-sources
            files: >-
              tests/browser/report-consistency-disclosure.spec.ts
              tests/browser/report-preview-print.spec.ts
              tests/browser/report-private-notes.spec.ts
              tests/browser/scanned-pdf-ocr-boundary.spec.ts
              tests/browser/source-consistency-resolution.spec.ts
              tests/browser/source-linked-write-after-removal.spec.ts
              tests/browser/source-removal-concurrency.spec.ts
              tests/browser/source-upload-case-deletion.spec.ts
          - name: stale-storage
            files: >-
              tests/browser/stale-consistency-resolution.spec.ts
              tests/browser/stale-extraction-provenance.spec.ts
              tests/browser/storage-protection-lifecycle.spec.ts
              tests/browser/storage-recovery-ui.spec.ts
              tests/browser/storage-schema-migration.spec.ts
          - name: suggestions-tail
            files: >-
              tests/browser/suggestion-atomic-transition.spec.ts
              tests/browser/suggestion-confirmation-failure.spec.ts
              tests/browser/suggestion-correction-failure.spec.ts
              tests/browser/suggestion-dismissal-failure.spec.ts
              tests/browser/suggestion-uncertain-failure.spec.ts
              tests/browser/timeline-storage-failure.spec.ts
              tests/browser/workspace-startup-recovery.spec.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser group
        env:
          TEST_FILES: ${{ matrix.files }}
        run: |
          read -ra files <<< "$TEST_FILES"
          ./node_modules/.bin/playwright test "${files[@]}" --workers=1 --retries=0
