name: Browser diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-diagnostic:
    name: Browser diagnostic — ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: accessibility
            file: tests/browser/accessibility.spec.ts
          - name: analysis-input-validation
            file: tests/browser/analysis-input-validation.spec.ts
          - name: backup-deep-link
            file: tests/browser/backup-deep-link.spec.ts
          - name: backup-interrupted
            file: tests/browser/backup-interrupted-processing-recovery.spec.ts
          - name: duplicate-original
            file: tests/browser/duplicate-original-rejection.spec.ts
          - name: encrypted-backup
            file: tests/browser/encrypted-backup-restore.spec.ts
          - name: extraction-warning
            file: tests/browser/extraction-warning-review.spec.ts
          - name: fact-removal
            file: tests/browser/fact-removal-failure.spec.ts
          - name: file-deletion
            file: tests/browser/file-deletion-failure.spec.ts
          - name: file-storage
            file: tests/browser/file-storage-failure.spec.ts
          - name: hostile-text
            file: tests/browser/hostile-text-boundary.spec.ts
          - name: library-accessibility
            file: tests/browser/library-workspace-accessibility.spec.ts
          - name: linked-source-removal
            file: tests/browser/linked-source-removal.spec.ts
          - name: malformed-extraction
            file: tests/browser/malformed-extraction-ui.spec.ts
          - name: malformed-pdf
            file: tests/browser/malformed-pdf-processing-boundary.spec.ts
          - name: manual-fact
            file: tests/browser/manual-fact-storage-failure.spec.ts
          - name: ocr-quality-integrity
            file: tests/browser/ocr-quality-integrity.spec.ts
          - name: original-hash-preflight
            file: tests/browser/original-hash-preflight.spec.ts
          - name: original-preview
            file: tests/browser/original-source-preview.spec.ts
          - name: oversized-file
            file: tests/browser/oversized-file-rejection.spec.ts
          - name: report-consistency
            file: tests/browser/report-consistency-disclosure.spec.ts
          - name: report-preview
            file: tests/browser/report-preview-print.spec.ts
          - name: report-private-notes
            file: tests/browser/report-private-notes.spec.ts
          - name: scanned-pdf
            file: tests/browser/scanned-pdf-ocr-boundary.spec.ts
          - name: source-consistency
            file: tests/browser/source-consistency-resolution.spec.ts
          - name: source-linked-after-removal
            file: tests/browser/source-linked-write-after-removal.spec.ts
          - name: source-removal-concurrency
            file: tests/browser/source-removal-concurrency.spec.ts
          - name: source-upload-case-deletion
            file: tests/browser/source-upload-case-deletion.spec.ts
          - name: suggestion-atomic
            file: tests/browser/suggestion-atomic-transition.spec.ts
          - name: suggestion-confirmation
            file: tests/browser/suggestion-confirmation-failure.spec.ts
          - name: suggestion-correction
            file: tests/browser/suggestion-correction-failure.spec.ts
          - name: suggestion-dismissal
            file: tests/browser/suggestion-dismissal-failure.spec.ts
          - name: suggestion-uncertain
            file: tests/browser/suggestion-uncertain-failure.spec.ts
          - name: timeline-storage
            file: tests/browser/timeline-storage-failure.spec.ts
          - name: workspace-startup
            file: tests/browser/workspace-startup-recovery.spec.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run isolated browser file
        run: ./node_modules/.bin/playwright test "${{ matrix.file }}" --workers=1 --retries=0
