name: Browser diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-diagnostic:
    name: Browser diagnostic — ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fact-interrupted
            file: tests/browser/fact-removal-failure.spec.ts
            grep: an interrupted fact removal preserves the confirmed fact and provenance
          - name: fact-stale
            file: tests/browser/fact-removal-failure.spec.ts
            grep: a stale rendered fact cannot remove the newer stored fact
          - name: source-linked-race
            file: tests/browser/source-removal-concurrency.spec.ts
            grep: a fact linked after render blocks duplicate source-removal attempts
          - name: source-stale
            file: tests/browser/source-removal-concurrency.spec.ts
            grep: a source changed after render is not removed as the stale row
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Repeat isolated browser scenario
        run: ./node_modules/.bin/playwright test "${{ matrix.file }}" --grep "${{ matrix.grep }}" --workers=1 --retries=0 --repeat-each=5
