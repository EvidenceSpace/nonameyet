name: Browser diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-diagnostic:
    name: Browser diagnostic — ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: suggestion-commit-once
            grep: ^confirmation and correction commit exact review decisions once$
          - name: suggestion-stale-confirm
            grep: ^a stale rendered card cannot confirm a changed suggestion$
          - name: suggestion-stale-nonacceptance
            grep: ^stale rendered cards cannot mark changed suggestions not-sure or dismissed$
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run isolated suggestion scenario
        run: ./node_modules/.bin/playwright test tests/browser/suggestion-atomic-transition.spec.ts --grep "${{ matrix.grep }}" --workers=1 --retries=0
