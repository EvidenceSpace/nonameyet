name: Browser diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-diagnostic:
    name: Browser diagnostic — ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backup-interrupted
            spec: tests/browser/backup-interrupted-processing-recovery.spec.ts
            grep: ""
          - name: case-deletion
            spec: tests/browser/case-deletion-failure.spec.ts
            grep: ""
          - name: case-restore
            spec: tests/browser/case-restore-failure.spec.ts
            grep: ""
          - name: currency-neutral
            spec: tests/browser/currency-neutral-amount.spec.ts
            grep: ""
          - name: intake-blocked
            spec: tests/browser/intake-storage-recovery.spec.ts
            grep: ""
          - name: intake-unavailable
            spec: tests/browser/intake-storage-unavailable.spec.ts
            grep: ""
          - name: malformed-extraction
            spec: tests/browser/malformed-extraction-ui.spec.ts
            grep: ""
          - name: processing-lease
            spec: tests/browser/processing-lease-recovery.spec.ts
            grep: ""
          - name: processing-cas
            spec: tests/browser/processing-storage-cas.spec.ts
            grep: ""
          - name: scanned-pdf
            spec: tests/browser/scanned-pdf-ocr-boundary.spec.ts
            grep: ""
          - name: stale-provenance
            spec: tests/browser/stale-extraction-provenance.spec.ts
            grep: ""
          - name: suggestion-uncertain
            spec: tests/browser/suggestion-uncertain-failure.spec.ts
            grep: ""
          - name: timeline-storage
            spec: tests/browser/timeline-storage-failure.spec.ts
            grep: ""
          - name: workspace-startup
            spec: tests/browser/workspace-startup-recovery.spec.ts
            grep: ""
          - name: intake-form-steps
            spec: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^intake form steps settle$
          - name: intake-unavailable-state
            spec: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^unavailable recovery state settles$
          - name: intake-unavailable-assertions
            spec: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^unavailable preservation assertions settle$
          - name: intake-blocked-state
            spec: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^blocked recovery state settles$
          - name: intake-blocked-retry
            spec: tests/browser/intake-storage-phase-diagnostic.spec.ts
            grep: ^blocked retry reaches a stored draft$
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run isolated browser spec
        env:
          INTAKE_DIAGNOSTIC: "1"
          TEST_FILE: ${{ matrix.spec }}
          TEST_GREP: ${{ matrix.grep }}
        run: |
          if [ -n "$TEST_GREP" ]; then
            ./node_modules/.bin/playwright test "$TEST_FILE" --grep "$TEST_GREP" --workers=1 --retries=0
          else
            ./node_modules/.bin/playwright test "$TEST_FILE" --workers=1 --retries=0
          fi
