name: Browser diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-diagnostic:
    name: Browser diagnostic — ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: image-ocr-output-limits-20x
            file: tests/browser/image-ocr-output-limits.spec.ts
            repeat: 20
          - name: malformed-extraction-ui-10x
            file: tests/browser/malformed-extraction-ui.spec.ts
            repeat: 10
          - name: pdf-processing-lifecycle-10x
            file: tests/browser/pdf-processing-lifecycle.spec.ts
            repeat: 10
          - name: report-private-notes-10x
            file: tests/browser/report-private-notes.spec.ts
            repeat: 10
          - name: timeline-storage-failure-10x
            file: tests/browser/timeline-storage-failure.spec.ts
            repeat: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Synchronize pinned local PDF.js assets
        run: npm run sync:pdfjs

      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Repeat browser file
        run: ./node_modules/.bin/playwright test "${{ matrix.file }}" --workers=1 --retries=0 --repeat-each=${{ matrix.repeat }}
