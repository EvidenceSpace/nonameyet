<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">Settings system</title><desc id="d">Durable onboarding preferences, workspace administration, privacy and history.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#f8f5ff"/></linearGradient><filter id="s"><feDropShadow dy="10" stdDeviation="14" flood-color="#24345b" flood-opacity=".13"/></filter></defs><rect width="1920" height="1080" fill="url(#b)"/><g font-family="Segoe UI,Arial"><text x="80" y="86" fill="#172033" font-size="42" font-weight="700">Settings system</text><text x="80" y="126" fill="#68748a" font-size="20">Onboarding preferences have durable homes; workspace history is first-class</text><rect x="100" y="190" width="470" height="780" rx="30" fill="#fff" stroke="#dce4f2" filter="url(#s)"/><text x="145" y="250" fill="#172033" font-size="25" font-weight="700">Settings</text><g fill="#4e5d75" font-size="17"><text x="155" y="315">Profile &amp; identity</text><text x="155" y="365">Legal defaults</text><text x="155" y="415">Personalization</text><text x="155" y="465">AI &amp; guidance</text><text x="155" y="515">Notifications</text><text x="155" y="565">Privacy &amp; sharing</text><text x="155" y="615">Security</text><text x="155" y="665">Workspace &amp; members</text><text x="155" y="715">Connections</text><rect x="135" y="735" width="390" height="48" rx="14" fill="#e8edff"/><text x="155" y="766">Workspace history</text><text x="155" y="825">Billing</text><text x="155" y="875">Help &amp; support</text></g><rect x="640" y="190" width="1160" height="310" rx="30" fill="#fff" stroke="#dce4f2" filter="url(#s)"/><text x="690" y="255" fill="#172033" font-size="27" font-weight="700">Appearance</text><text x="690" y="300" fill="#68748a" font-size="19">System follows OS automatically · Light and Dark are explicit overrides</text><rect x="640" y="555" width="550" height="415" rx="30" fill="#eff9f6" stroke="#c7ebe1"/><rect x="1250" y="555" width="550" height="415" rx="30" fill="#fff5f6" stroke="#ffd2d9"/><text x="690" y="625" fill="#172033" font-size="27" font-weight="700">Workspace history</text><text x="690" y="670" fill="#68748a" font-size="18">proposal ≠ approval</text><text x="690" y="710" fill="#68748a" font-size="18">Undo preserves the receipt</text><text x="1300" y="625" fill="#172033" font-size="27" font-weight="700">Privacy boundary</text><text x="1300" y="670" fill="#68748a" font-size="18">membership ≠ case access</text><text x="1300" y="710" fill="#68748a" font-size="18">payment ≠ case access</text></g></svg>
