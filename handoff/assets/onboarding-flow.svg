x="9"/><rect x="1565" y="390" width="250" height="18" rx="9"/><rect x="1565" y="440" width="250" height="18" rx="9"/></g><g fill="url(#p)"><rect x="105" y="590" width="150" height="52" rx="17"/><rect x="470" y="590" width="150" height="52" rx="17"/><rect x="835" y="590" width="150" height="52" rx="17"/><rect x="1200" y="590" width="150" height="52" rx="17"/><rect x="1565" y="590" width="150" height="52" rx="17"/></g><rect x="555" y="795" width="810" height="130" rx="28" fill="#eff9f6" stroke="#c7ebe1"/><text x="600" y="850" fill="#172033" font-size="25" font-weight="700">Preferences persist to Settings; the first story does not</text><text x="600" y="890" fill="#68748a" font-size="18">New Case owns the Story Field after onboarding</text></g></svg>
